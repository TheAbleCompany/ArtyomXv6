# limine.conf — конфигурация загрузчика Limine для molloy-xv6-synth.
# Файл кладётся в /boot/limine/limine.conf внутри ISO/HDD-образа
# (этот путь Limine ищет первым и в BIOS, и в UEFI режиме).

timeout: 3

/ArtyomXv6 (molloy-xv6-synth)
    protocol: limine
    path: boot():/boot/kernel.elf
    module_path: boot():/boot/initrd.bin
